# DSH 指挥家（Agent Conductor）：把其他 agent CLI 变成 DSH 可派活的子代理。
# 三组行：插件自身（host 工具 + 面板 RPC 路由 + client 面板）、产品 provider、
# 以及原生 subagent 委托工具（subagent_codex / subagent_claude_code）。
- insert:
    - id: conductor
      name: dsh-agent-conductor
    # --- 产品 provider（host 面单例；对应官方 backend 包，作为依赖安装）---
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
    # --- 原生委托工具：agent 在聊天里直接派活 ---
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed
    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed
